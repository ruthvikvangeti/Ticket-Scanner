<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scratch-Off Scanner</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      margin: 0;
      padding: 20px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    #scanInput { opacity: 0; position: absolute; pointer-events: none; }

    #status {
      width: 100%; max-width: 400px; height: 220px;
      margin-bottom: 20px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    #glassCanvas { width: 100%; height: 100%; display: block; }
    #statusText {
      position: absolute;
      font-size: 18px; font-weight: bold; color: #1a1a1a;
      text-shadow: 0 1px 3px rgba(255,255,255,0.8);
      pointer-events: none;
      z-index: 1;
    }

    .actionRow { display: flex; gap: 12px; width: 100%; max-width: 400px; }
    button {
      flex: 1; padding: 18px; font-size: 16px; font-weight: bold; color: white;
      border: none; border-radius: 16px; cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.4);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.35);
      transform-style: preserve-3d;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    #endDayBtn { background: rgba(52, 168, 83, 0.6); }
    #resetBtn { background: rgba(234, 67, 53, 0.6); }

    @keyframes flipButtonVertical {
      0%   { transform: rotateX(0deg); }
      50%  { transform: rotateX(-92deg); }
      100% { transform: rotateX(0deg); }
    }
    @keyframes breatheBounceGreen {
      0%   { background: rgba(52, 168, 83, 0.6); animation-timing-function: ease-out; }
      45%  { background: rgba(143, 217, 172, 0.55); animation-timing-function: cubic-bezier(0.68, -0.55, 0.265, 1.4); }
      75%  { background: rgba(42, 129, 68, 0.65); }
      100% { background: rgba(52, 168, 83, 0.6); }
    }
    @keyframes breatheBounceRed {
      0%   { background: rgba(234, 67, 53, 0.6); animation-timing-function: ease-out; }
      45%  { background: rgba(246, 167, 158, 0.55); animation-timing-function: cubic-bezier(0.68, -0.55, 0.265, 1.4); }
      75%  { background: rgba(196, 39, 26, 0.65); }
      100% { background: rgba(234, 67, 53, 0.6); }
    }
    #endDayBtn.flipping {
      animation: flipButtonVertical 0.4s cubic-bezier(0.45, 0.05, 0.55, 0.95),
                 breatheBounceGreen 0.65s ease-in-out;
    }
    #resetBtn.flipping {
      animation: flipButtonVertical 0.4s cubic-bezier(0.45, 0.05, 0.55, 0.95),
                 breatheBounceRed 0.65s ease-in-out;
    }

    #configBox {
      width: 100%; max-width: 400px; margin-bottom: 16px; padding: 12px;
      background: rgba(240, 244, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px; border: 1px solid rgba(255,255,255,0.6); font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    #configBox input { width: 100%; padding: 8px; margin-top: 6px; box-sizing: border-box; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="configBox">
    <div>Apps Script URL (one-time setup):</div>
    <input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
    <button onclick="saveApiUrl()" style="margin-top:8px; background:#4285F4; padding:10px;">Save URL</button>
  </div>

  <div id="status">
    <canvas id="glassCanvas"></canvas>
    <span id="statusText">Ready to scan</span>
  </div>
  <input type="text" id="scanInput" autocomplete="off" autocorrect="off" autocapitalize="off">

  <div class="actionRow">
    <button id="endDayBtn" onclick="handleEndDay(event)">End of Day</button>
    <button id="resetBtn" onclick="handleReset(event)">Reset Day</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    var statusEl = document.getElementById('status');
    var canvas = document.getElementById('glassCanvas');

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
    camera.position.set(0, 0, 8);

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);

    var pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    var light1 = new THREE.DirectionalLight(0xffffff, 1.2);
    light1.position.set(3, 5, 4);
    scene.add(light1);
    var light2 = new THREE.DirectionalLight(0xffffff, 0.6);
    light2.position.set(-4, -2, 3);
    scene.add(light2);
    scene.add(new THREE.AmbientLight(0xffffff, 0.3));

    // ---- Outer glass capsule ----
    var glassGeo = new THREE.CapsuleGeometry(1.6, 1.4, 8, 24);
    var glassMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transmission: 1,
      roughness: 0.04,
      thickness: 1.2,
      ior: 1.5,
      clearcoat: 1,
      clearcoatRoughness: 0.05,
      envMapIntensity: 1.2
    });
    var glass = new THREE.Mesh(glassGeo, glassMat);
    scene.add(glass);

    // ---- Inner liquid (green), clipped to a rising height via scale ----
    var liquidGeo = new THREE.CapsuleGeometry(1.42, 1.24, 8, 24);
    var liquidMat = new THREE.MeshPhysicalMaterial({
      color: 0x22c55e,
      transmission: 0.55,
      roughness: 0.15,
      thickness: 1.0,
      ior: 1.33,
      envMapIntensity: 1.0
    });
    var liquid = new THREE.Mesh(liquidGeo, liquidMat);
    liquid.scale.y = 0.001; // starts empty
    liquid.position.y = -1.5; // anchored at the bottom, grows upward
    scene.add(liquid);
    // Re-anchor pivot: since scaling a centered geometry scales both ways,
    // we offset position to compensate so it visually fills bottom-up.
    function setLiquidLevel(fraction) {
      var f = Math.max(0.001, Math.min(1, fraction));
      liquid.scale.y = f;
      liquid.position.y = -1.5 * (1 - f);
    }

    function resizeRenderer() {
      var w = statusEl.clientWidth;
      var h = statusEl.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resizeRenderer);
    resizeRenderer();

    var clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      var t = clock.getElapsedTime();
      glass.rotation.y = Math.sin(t * 0.3) * 0.15;
      liquid.rotation.y = glass.rotation.y;
      renderer.render(scene, camera);
    }
    animate();

    window.setLiquidLevel = setLiquidLevel;
  </script>

  <script>
    var API_URL = localStorage.getItem('appsScriptUrl') || '';
    document.getElementById('apiUrlInput').value = API_URL;
    if (API_URL) document.getElementById('configBox').style.display = 'none';

    function saveApiUrl() {
      var url = document.getElementById('apiUrlInput').value.trim();
      if (!url) return;
      localStorage.setItem('appsScriptUrl', url);
      API_URL = url;
      document.getElementById('configBox').style.display = 'none';
      statusText.textContent = 'Saved. Ready to scan';
    }

    var input = document.getElementById('scanInput');
    var statusBox = document.getElementById('status');
    var statusText = document.getElementById('statusText');
    var endDayBtn = document.getElementById('endDayBtn');
    var resetBtn = document.getElementById('resetBtn');

    function refreshProgress() {
      if (!API_URL) return;
      callApi({ action: 'progress' }).then(function(result) {
        var total = result.totalGames || 0;
        var done = result.scannedToday || 0;
        var pct = total > 0 ? done / total : 0;
        if (window.setLiquidLevel) window.setLiquidLevel(pct);
      }).catch(function() { /* progress is a nice-to-have, fail silently */ });
    }

    function keepFocus() { input.focus(); }

    statusBox.addEventListener('click', function() {
      statusText.textContent = 'Reading...';
      keepFocus();
    });

    window.addEventListener('load', keepFocus);
    window.addEventListener('focus', keepFocus);

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); submitScan(input.value.trim()); input.value = ''; }
    });

    var jsonpCounter = 0;

    function callApi(params) {
      return new Promise(function(resolve, reject) {
        if (!API_URL) {
          statusText.textContent = 'Please set your Apps Script URL above first';
          document.getElementById('configBox').style.display = 'block';
          reject('no url');
          return;
        }

        var callbackName = 'jsonpCallback' + (jsonpCounter++);
        var timeoutId;

        window[callbackName] = function(result) {
          clearTimeout(timeoutId);
          delete window[callbackName];
          document.body.removeChild(script);
          resolve(result);
        };

        params.callback = callbackName;
        var url = API_URL + '?' + new URLSearchParams(params).toString();

        var script = document.createElement('script');
        script.src = url;
        script.onerror = function() {
          clearTimeout(timeoutId);
          delete window[callbackName];
          if (script.parentNode) document.body.removeChild(script);
          reject('Could not reach the server. Check your Apps Script URL.');
        };
        document.body.appendChild(script);

        timeoutId = setTimeout(function() {
          delete window[callbackName];
          if (script.parentNode) document.body.removeChild(script);
          reject('Request timed out. Check your connection.');
        }, 15000);
      });
    }

    function submitScan(code) {
      if (!code) { keepFocus(); return; }
      callApi({ action: 'scan', code: code })
        .then(function(result) {
          refreshProgress();
          keepFocus();
        })
        .catch(function(err) {
          keepFocus();
        });
    }

    function handleEndDay(event) {
      endDayBtn.classList.remove('flipping'); void endDayBtn.offsetWidth; endDayBtn.classList.add('flipping');
      setTimeout(function() { endDayBtn.classList.remove('flipping'); }, 650);
      if (!confirm('Close out the day? This archives everything and rolls forward to tomorrow.')) return;
      statusText.textContent = 'Running End of Day...';
      callApi({ action: 'endday' })
        .then(function(result) {
          statusText.textContent = result.message;
          refreshProgress();
          setTimeout(function() { statusText.textContent = 'Ready to scan'; }, 3000);
          keepFocus();
        })
        .catch(function(err) {
          statusText.textContent = 'Error: ' + err;
        });
    }

    function handleReset(event) {
      resetBtn.classList.remove('flipping'); void resetBtn.offsetWidth; resetBtn.classList.add('flipping');
      setTimeout(function() { resetBtn.classList.remove('flipping'); }, 650);
      if (!confirm('Reset back to last End of Day? This undoes today\'s scans.')) return;
      statusText.textContent = 'Resetting...';
      callApi({ action: 'reset' })
        .then(function(result) {
          statusText.textContent = result.message;
          refreshProgress();
          setTimeout(function() { statusText.textContent = 'Ready to scan'; }, 2500);
          keepFocus();
        })
        .catch(function(err) {
          statusText.textContent = 'Error: ' + err;
        });
    }

    keepFocus();
    setTimeout(refreshProgress, 800); // slight delay so the module script's setLiquidLevel is ready
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scratch-Off Scanner</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 20px;
      background: #2b323e;
      background-image: 
        radial-gradient(circle at 15% 45%, rgba(16, 185, 129, 0.28) 0%, transparent 45%),
        radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 85% 55%, rgba(244, 63, 94, 0.3) 0%, transparent 45%);
      color: #f8fafc;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh;
    }

    /* NEON PRISM EDGE GLASS CARD */
    #status {
      width: 100%; max-width: 480px; height: 320px; margin-bottom: 24px;
      position: relative; display: flex; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 36px; 
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.45),
        inset 0 1px 2px rgba(255, 255, 255, 0.6),
        inset 0 -1px 2px rgba(0, 0, 0, 0.3),
        0 0 30px rgba(56, 189, 248, 0.25),
        0 0 50px rgba(244, 63, 94, 0.2);
    }

    .circle-container { position: relative; width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; }
    svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    circle { fill: none; stroke-width: 14; stroke-linecap: round; }
    
    .bg-ring { stroke: rgba(255, 255, 255, 0.08); }
    
    .progress-ring {
      stroke: #38bdf8; 
      stroke-dasharray: 565; 
      stroke-dashoffset: 565;
      transition: stroke-dashoffset 0.15s ease-in-out, stroke 0.2s ease;
      filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.75));
    }

    .ring-text { position: absolute; text-align: center; pointer-events: none; }
    #countDisplay { font-size: 38px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; text-shadow: 0 2px 12px rgba(0,0,0,0.4); }

    #syncIndicator {
      position: absolute; bottom: 18px; font-size: 11px; font-weight: 600;
      color: #cbd5e1; display: flex; align-items: center; gap: 6px;
    }

    .dot { 
      width: 8px; height: 8px; 
      background-color: #38bdf8; 
      border-radius: 50%; 
      display: inline-block; 
      box-shadow: 0 0 10px #38bdf8;
      animation: pulse 1.2s infinite; 
    }
    
    @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.7; } 50% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.7; } }

    /* PRISM GLASS BUTTONS */
    .actionRow { display: flex; gap: 12px; width: 100%; max-width: 480px; flex-shrink: 0; }
    button {
      flex: 1; padding: 18px; font-size: 16px; font-weight: 700; color: white;
      border-radius: 20px; cursor: pointer; 
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      transition: all 0.15s ease;
    }
    
    #endDayBtn { 
      background: rgba(56, 189, 248, 0.18); 
      border: 1px solid rgba(56, 189, 248, 0.5);
      color: #ffffff; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.25), 0 0 15px rgba(56, 189, 248, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.4);
    }
    
    #resetBtn { 
      background: rgba(244, 63, 94, 0.18); 
      border: 1px solid rgba(244, 63, 94, 0.5);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25), 0 0 15px rgba(244, 63, 94, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.4);
    }
    
    button:active { transform: scale(0.97); }

    #configBox {
      width: 100%; max-width: 480px; margin-bottom: 16px; padding: 16px;
      background: rgba(255, 255, 255, 0.1); border-radius: 18px; 
      border: 1px solid rgba(255, 255, 255, 0.25); font-size: 13px; color: #fff;
    }
    #configBox input { width: 100%; padding: 10px; margin-top: 8px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(15, 23, 42, 0.6); color: #fff; box-sizing: border-box; }
  </style>
</head>
<body>

  <div id="configBox">
    <div><b>Apps Script URL:</b></div>
    <input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
    <button onclick="saveApiUrl()" style="margin-top:10px; background:#38bdf8; color:#0f172a; border:none; padding:10px; width:100%; border-radius:8px; font-weight:bold;">Save URL</button>
  </div>

  <div id="status">
    <div class="circle-container">
      <svg>
        <circle class="bg-ring" cx="110" cy="110" r="90"></circle>
        <circle class="progress-ring" id="ringFill" cx="110" cy="110" r="90"></circle>
      </svg>
      <div class="ring-text">
        <div id="countDisplay">0 / 42</div>
      </div>
    </div>
    <div id="syncIndicator"><span class="dot" id="syncDot"></span> <span id="syncStatus">Live Sync Active</span></div>
  </div>

  <div class="actionRow">
    <button id="endDayBtn" onclick="handleEndDay(event)">End of Day</button>
    <button id="resetBtn" onclick="handleReset(event)">Reset Day</button>
  </div>

  <script>
    var API_URL = localStorage.getItem('appsScriptUrl') || '';
    document.getElementById('apiUrlInput').value = API_URL;
    if (API_URL) document.getElementById('configBox').style.display = 'none';

    function saveApiUrl() {
      var url = document.getElementById('apiUrlInput').value.trim();
      if (!url) return;
      localStorage.setItem('appsScriptUrl', url);
      API_URL = url;
      document.getElementById('configBox').style.display = 'none';
      refreshProgress();
    }

    var ringFill = document.getElementById('ringFill');
    var countDisplay = document.getElementById('countDisplay');

    var cachedTotal = 42;
    var cachedScanned = 0;
    const CIRCUMFERENCE = 565;

    var scanQueue = [];
    var isProcessingQueue = false;

    function setCircleProgress(fraction) {
      var f = Math.max(0, Math.min(1, fraction));
      var offset = CIRCUMFERENCE - (f * CIRCUMFERENCE);
      ringFill.style.strokeDashoffset = offset;
      ringFill.style.stroke = f >= 1 ? '#818cf8' : '#38bdf8';
    }

    function applyLiquidLevel() {
      countDisplay.textContent = cachedScanned + ' / ' + cachedTotal;
      var pct = cachedTotal > 0 ? cachedScanned / cachedTotal : 0;
      setCircleProgress(pct);
    }

    function refreshProgress() {
      if (!API_URL || isProcessingQueue || scanQueue.length > 0) return;
      
      callApi({ action: 'progress' }).then(function(result) {
        if (result && result.totalGames > 0 && scanQueue.length === 0) {
          cachedTotal = result.totalGames;
          cachedScanned = result.scannedToday;
          applyLiquidLevel();
        }
      }).catch(function(err) {});
    }

    setInterval(refreshProgress, 500);

    var scanBuffer = '';
    var scanTimeout;

    document.addEventListener('keydown', function(e) {
      clearTimeout(scanTimeout);

      if (e.key === 'Enter') {
        e.preventDefault();
        var codeToSubmit = scanBuffer.trim();
        scanBuffer = '';
        if (codeToSubmit) enqueueScan(codeToSubmit);
        return;
      }

      if (e.key === 'Backspace') {
        scanBuffer = scanBuffer.slice(0, -1);
      } else if (e.key.length === 1) {
        scanBuffer += e.key;
      }

      scanTimeout = setTimeout(function() { scanBuffer = ''; }, 100);
    });

    function enqueueScan(code) {
      cachedScanned = Math.min(cachedTotal, cachedScanned + 1);
      applyLiquidLevel();

      scanQueue.push(code);
      processNextQueueItem();
    }

    function processNextQueueItem() {
      if (isProcessingQueue || scanQueue.length === 0) return;

      isProcessingQueue = true;
      var currentCode = scanQueue[0];

      callApi({ action: 'scan', code: currentCode })
        .then(function(result) {
          scanQueue.shift();
          isProcessingQueue = false;

          if (!result || !result.success) {
            cachedScanned = Math.max(0, cachedScanned - 1);
            applyLiquidLevel();
          }

          if (scanQueue.length > 0) {
            processNextQueueItem();
          } else {
            setTimeout(refreshProgress, 100);
          }
        })
        .catch(function(err) {
          isProcessingQueue = false;
          setTimeout(processNextQueueItem, 300);
        });
    }

    var jsonpCounter = 0;

    function callApi(params) {
      return new Promise(function(resolve, reject) {
        if (!API_URL) {
          document.getElementById('configBox').style.display = 'block';
          reject('no url');
          return;
        }

        var callbackName = 'jsonpCallback' + (jsonpCounter++);
        var timeoutId;

        window[callbackName] = function(result) {
          clearTimeout(timeoutId);
          delete window[callbackName];
          if (script.parentNode) document.body.removeChild(script);
          resolve(result);
        };

        params.callback = callbackName;
        var url = API_URL + '?' + new URLSearchParams(params).toString();

        var script = document.createElement('script');
        script.src = url;
        script.onerror = function() {
          clearTimeout(timeoutId);
          delete window[callbackName];
          if (script.parentNode) document.body.removeChild(script);
          reject('Server error');
        };
        document.body.appendChild(script);

        timeoutId = setTimeout(function() {
          delete window[callbackName];
          if (script.parentNode) document.body.removeChild(script);
          reject('Timeout');
        }, 10000);
      });
    }

    function handleEndDay(event) {
      if (!confirm('Close out the day? This archives everything.')) return;
      callApi({ action: 'endday' }).then(function() { refreshProgress(); });
    }

    function handleReset(event) {
      if (!confirm('Reset back to last End of Day?')) return;
      callApi({ action: 'reset' }).then(function() { refreshProgress(); });
    }

    setTimeout(refreshProgress, 150);
  </script>
</body>
</html>

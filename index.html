<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scratch-Off Scanner</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      margin: 0;
      padding: 20px;
      background: #0d1117;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    #status {
      width: 100%; max-width: 480px;
      height: 260px;
      margin-bottom: 20px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      background: radial-gradient(ellipse at 50% 40%, #161b22 0%, #0d1117 70%);
      border-radius: 24px;
      border: 1px solid #30363d;
    }
    #glassCanvas { width: 100%; height: 100%; display: block; }
    #statusText {
      position: absolute;
      font-size: 20px; font-weight: bold; color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 1;
      text-align: center;
    }

    .actionRow { display: flex; gap: 12px; width: 100%; max-width: 480px; flex-shrink: 0; }
    button {
      flex: 1; padding: 18px; font-size: 16px; font-weight: bold; color: white;
      border: none; border-radius: 16px; cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.15);
      transform-style: preserve-3d;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    #endDayBtn { background: rgba(52, 168, 83, 0.92); }
    #resetBtn { background: rgba(234, 67, 53, 0.92); }

    @keyframes flipButtonVertical {
      0%   { transform: rotateX(0deg); }
      50%  { transform: rotateX(-92deg); }
      100% { transform: rotateX(0deg); }
    }
    @keyframes breatheBounceGreen {
      0%   { background: rgba(52, 168, 83, 0.92); animation-timing-function: ease-out; }
      45%  { background: rgba(143, 217, 172, 0.85); animation-timing-function: cubic-bezier(0.68, -0.55, 0.265, 1.4); }
      75%  { background: rgba(42, 129, 68, 0.95); }
      100% { background: rgba(52, 168, 83, 0.92); }
    }
    @keyframes breatheBounceRed {
      0%   { background: rgba(234, 67, 53, 0.92); animation-timing-function: ease-out; }
      45%  { background: rgba(246, 167, 158, 0.85); animation-timing-function: cubic-bezier(0.68, -0.55, 0.265, 1.4); }
      75%  { background: rgba(196, 39, 26, 0.95); }
      100% { background: rgba(234, 67, 53, 0.92); }
    }
    #endDayBtn.flipping {
      animation: flipButtonVertical 0.4s cubic-bezier(0.45, 0.05, 0.55, 0.95),
                 breatheBounceGreen 0.65s ease-in-out;
    }
    #resetBtn.flipping {
      animation: flipButtonVertical 0.4s cubic-bezier(0.45, 0.05, 0.55, 0.95),
                 breatheBounceRed 0.65s ease-in-out;
    }

    #configBox {
      width: 100%; max-width: 480px; margin-bottom: 16px; padding: 12px;
      flex-shrink: 0;
      background: #161b22;
      border-radius: 16px; border: 1px solid #30363d; font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    #configBox input { width: 100%; padding: 8px; margin-top: 6px; box-sizing: border-box; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="configBox">
    <div>Apps Script URL (one-time setup):</div>
    <input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
    <button onclick="saveApiUrl()" style="margin-top:8px; background:#4285F4; border:none; color:#fff; border-radius:8px; padding:10px;">Save URL</button>
  </div>

  <div id="status">
    <canvas id="glassCanvas"></canvas>
    <span id="statusText">Ready to scan</span>
  </div>

  <div class="actionRow">
    <button id="endDayBtn" onclick="handleEndDay(event)">End of Day</button>
    <button id="resetBtn" onclick="handleReset(event)">Reset Day</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    var statusEl = document.getElementById('status');
    var canvas = document.getElementById('glassCanvas');

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
    camera.position.set(0, 0, 8);

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    var pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    var light1 = new THREE.DirectionalLight(0xffffff, 2.2);
    light1.position.set(3, 6, 5);
    scene.add(light1);
    var light2 = new THREE.DirectionalLight(0x00e5ff, 1.2);
    light2.position.set(-4, -3, 3);
    scene.add(light2);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    // ---- Outer Glass Capsule ----
    var glassGeo = new RoundedBoxGeometry(4.2, 1.7, 1.7, 6, 0.7);
    var glassMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transmission: 0.95,
      roughness: 0.05,
      thickness: 1.2,
      ior: 1.5,
      clearcoat: 1,
      clearcoatRoughness: 0.03,
      envMapIntensity: 1.8
    });
    var glass = new THREE.Mesh(glassGeo, glassMat);
    scene.add(glass);

    // ---- Inner Liquid Filling Horizontally (Left to Right) ----
    var LIQUID_LEFT = -1.95;
    var LIQUID_RIGHT = 1.95;

    // Normal pointing right (1, 0, 0) for progressive left-to-right fill
    var clipPlane = new THREE.Plane(new THREE.Vector3(1, 0, 0), -LIQUID_LEFT);
    renderer.localClippingEnabled = true;

    var liquidGeo = new RoundedBoxGeometry(4.0, 1.45, 1.45, 6, 0.58);
    var liquidMatNormal = new THREE.MeshPhysicalMaterial({
      color: 0x00e5ff,
      emissive: 0x0097a7,
      emissiveIntensity: 0.3,
      transmission: 0.1,
      roughness: 0.15,
      thickness: 0.5,
      ior: 1.33,
      clippingPlanes: [clipPlane]
    });
    var liquidMatComplete = new THREE.MeshPhysicalMaterial({
      color: 0x00ff88,
      emissive: 0x00a859,
      emissiveIntensity: 0.5,
      transmission: 0.1,
      roughness: 0.1,
      thickness: 0.5,
      ior: 1.33,
      clippingPlanes: [clipPlane]
    });
    var liquid = new THREE.Mesh(liquidGeo, liquidMatNormal);
    scene.add(liquid);

    var currentFraction = 0;
    var targetFraction = 0;

    function setLiquidLevel(fraction) {
      targetFraction = Math.max(0, Math.min(1, fraction));
    }

    function resizeRenderer() {
      var w = statusEl.clientWidth;
      var h = statusEl.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resizeRenderer);
    new ResizeObserver(resizeRenderer).observe(statusEl);
    resizeRenderer();

    var clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      var t = clock.getElapsedTime();

      // Smooth gradual rise/fill of liquid
      currentFraction += (targetFraction - currentFraction) * 0.05;
      var currentX = LIQUID_LEFT + (LIQUID_RIGHT - LIQUID_LEFT) * currentFraction;
      clipPlane.constant = -currentX;

      liquid.material = currentFraction >= 0.99 ? liquidMatComplete : liquidMatNormal;

      glass.rotation.y = Math.sin(t * 0.3) * 0.15;
      liquid.rotation.y = glass.rotation.y;
      renderer.render(scene, camera);
    }
    animate();

    window.setLiquidLevel = setLiquidLevel;
  </script>

  <script>
    var API_URL = localStorage.getItem('appsScriptUrl') || '';
    document.getElementById('apiUrlInput').value = API_URL;
    if (API_URL) document.getElementById('configBox').style.display = 'none';

    function saveApiUrl() {
      var url = document.getElementById('apiUrlInput').value.trim();
      if (!url) return;
      localStorage.setItem('appsScriptUrl', url);
      API_URL = url;
      document.getElementById('configBox').style.display = 'none';
      statusText.textContent = 'Saved. Ready to scan';
      refreshProgress();
    }

    var statusBox = document.getElementById('status');
    var statusText = document.getElementById('statusText');
    var endDayBtn = document.getElementById('endDayBtn');
    var resetBtn = document.getElementById('resetBtn');
    var cachedTotal = 38, cachedScanned = 0;

    function applyLiquidLevel() {
      var pct = cachedTotal > 0 ? cachedScanned / cachedTotal : 0;
      var pctInt = Math.round(pct * 100);
      statusText.textContent = cachedScanned + ' / ' + cachedTotal + ' (' + pctInt + '%)';
      if (window.setLiquidLevel) window.setLiquidLevel(pct);
    }

    function refreshProgress() {
      if (!API_URL) return;
      callApi({ action: 'progress' }).then(function(result) {
        cachedTotal = result.totalGames || 38;
        cachedScanned = result.scannedToday || 0;
        applyLiquidLevel();
      }).catch(function(err) { /* silent catch */ });
    }

    statusBox.addEventListener('click', function() {
      statusText.textContent = 'Reading...';
    });

    var scanBuffer = '';
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitScan(scanBuffer.trim());
        scanBuffer = '';
        return;
      }
      if (e.key === 'Backspace') {
        scanBuffer = scanBuffer.slice(0, -1);
        return;
      }
      if (e.key.length === 1) {
        scanBuffer += e.key;
      }
    });

    var jsonpCounter = 0;

    function callApi(params) {
      return new Promise(function(resolve, reject) {
        if (!API_URL) {
          statusText.textContent = 'Please set Apps Script URL above';
          document.getElementById('configBox').style.display = 'block';
          reject('no url');
          return;
        }

        var callbackName = 'jsonpCallback' + (jsonpCounter++);
        var timeoutId;

        window[callbackName] = function(result) {
          clearTimeout(timeoutId);
          delete window[callbackName];
          document.body.removeChild(script);
          resolve(result);
        };

        params.callback = callbackName;
        var url = API_URL + '?' + new URLSearchParams(params).toString();

        var script = document.createElement('script');
        script.src = url;
        script.onerror = function() {
          clearTimeout(timeoutId);
          delete window[callbackName];
          if (script.parentNode) document.body.removeChild(script);
          reject('Server error');
        };
        document.body.appendChild(script);

        timeoutId = setTimeout(function() {
          delete window[callbackName];
          if (script.parentNode) document.body.removeChild(script);
          reject('Timeout');
        }, 15000);
      });
    }

    function submitScan(code) {
      if (!code) return;

      var hadTotal = cachedTotal > 0;
      if (hadTotal) {
        cachedScanned = Math.min(cachedTotal, cachedScanned + 1);
        applyLiquidLevel();
      }

      callApi({ action: 'scan', code: code })
        .then(function(result) {
          refreshProgress();
        })
        .catch(function(err) {
          if (hadTotal) {
            cachedScanned = Math.max(0, cachedScanned - 1);
            applyLiquidLevel();
          }
        });
    }

    function handleEndDay(event) {
      endDayBtn.classList.remove('flipping'); void endDayBtn.offsetWidth; endDayBtn.classList.add('flipping');
      setTimeout(function() { endDayBtn.classList.remove('flipping'); }, 650);
      if (!confirm('Close out the day? This archives everything.')) return;
      statusText.textContent = 'Running End of Day...';
      callApi({ action: 'endday' })
        .then(function(result) {
          statusText.textContent = result.message || 'Day Ended';
          refreshProgress();
          setTimeout(function() { statusText.textContent = 'Ready to scan'; }, 3000);
        })
        .catch(function(err) {
          statusText.textContent = 'Error: ' + err;
        });
    }

    function handleReset(event) {
      resetBtn.classList.remove('flipping'); void resetBtn.offsetWidth; resetBtn.classList.add('flipping');
      setTimeout(function() { resetBtn.classList.remove('flipping'); }, 650);
      if (!confirm('Reset back to last End of Day?')) return;
      statusText.textContent = 'Resetting...';
      callApi({ action: 'reset' })
        .then(function(result) {
          statusText.textContent = result.message || 'Day Reset';
          refreshProgress();
          setTimeout(function() { statusText.textContent = 'Ready to scan'; }, 2500);
        })
        .catch(function(err) {
          statusText.textContent = 'Error: ' + err;
        });
    }

    setTimeout(refreshProgress, 800);
  </script>
</body>
</html>

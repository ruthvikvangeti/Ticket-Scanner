<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Scratch-Off Scanner</title>
  
  <!-- iOS Full-Screen Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ticket Scanner">
  <meta name="mobile-web-app-capable" content="yes">
  
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; width: 100%; margin: 0; padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      padding: 20px 20px 28px 20px;
      background: #f8fafc; color: #0f172a;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      min-height: 100vh;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(28px, env(safe-area-inset-bottom));
    }

    /* ENLARGED STATUS CARD TO OCCUPY FULL SCREEN SPACE */
    #status {
      width: 100%; max-width: 480px; flex: 1; max-height: 380px;
      margin-top: 5px; margin-bottom: 20px;
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #ffffff; border-radius: 32px; border: 1px solid #e2e8f0;
      box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.06);
      will-change: transform;
    }

    .circle-container { position: relative; width: 260px; height: 260px; display: flex; align-items: center; justify-content: center; }
    svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    circle { fill: none; stroke-width: 16; stroke-linecap: round; }
    .bg-ring { stroke: #f1f5f9; }
    .progress-ring {
      stroke: #00F0FF; stroke-dasharray: 660; stroke-dashoffset: 660;
      opacity: 0;
      transition: stroke-dashoffset 0.08s linear, opacity 0.15s ease;
      filter: drop-shadow(0 4px 12px rgba(0, 240, 255, 0.45));
    }

    .ring-text { position: absolute; text-align: center; pointer-events: none; }
    #countDisplay { font-size: 42px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; }

    #syncIndicator {
      position: absolute; bottom: 18px; font-size: 12px; font-weight: 700;
      color: #64748b; display: flex; align-items: center; gap: 8px;
    }

    /* DYNAMIC SYNC DOT STYLING */
    .dot {
      width: 10px; height: 10px; border-radius: 50%; display: inline-block;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* IDLE STATE: ELECTRIC CYAN */
    .dot.idle {
      background-color: #00F0FF;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
      animation: none;
    }

    /* SYNCING / QUEUED STATE: ANIMATED ORANGE */
    .dot.syncing {
      background-color: #FF9500;
      box-shadow: 0 0 8px rgba(255, 149, 0, 0.8);
      animation: pulseOrange 1.0s infinite ease-in-out;
    }

    @keyframes pulseOrange {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.35); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    .actionRow { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 480px; margin-bottom: 5px; }
    .btnGroup { display: flex; gap: 12px; }
    button {
      flex: 1; padding: 18px; font-size: 16px; font-weight: 700; color: white;
      border: none; border-radius: 20px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.08); transition: transform 0.1s ease;
    }
    #previewBtn { background: #2563eb; color: #ffffff; border: 1px solid #1d4ed8; font-size: 17px; }
    #endDayBtn { background: #00F0FF; color: #0f172a; font-weight: 800; }
    #resetBtn { background: #ef4444; }
    button:active { transform: scale(0.96); }

    /* PREVIEW MODAL */
    #previewModal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px);
      z-index: 999; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-card {
      background: #ffffff; border-radius: 24px; width: 100%; max-width: 960px;
      max-height: 92vh; display: flex; flex-direction: column; overflow: hidden;
      border: 1px solid #e2e8f0; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    }
    .modal-header {
      padding: 18px 24px; background: #0f172a; color: white;
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; background: #ffffff; color: #0f172a; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid #e2e8f0; display: flex; gap: 12px; background: #f8fafc; }

    /* FULL EXCEL SHEET GRID LAYOUT */
    table.excel-full-sheet {
      width: 100%; border-collapse: collapse; font-size: 12px; font-family: Calibri, Segoe UI, sans-serif;
      border: 2px solid #000000; background: #ffffff; color: #000000;
    }
    table.excel-full-sheet th, table.excel-full-sheet td {
      border: 1px solid #000000; padding: 4px 6px; text-align: center;
    }
    table.excel-full-sheet th {
      background: #f1f5f9; font-weight: bold; color: #000000; font-size: 11px; text-transform: uppercase;
      border-bottom: 2px solid #000000;
    }
    
    .excel-section-hdr td {
      background: #e2e8f0; font-weight: bold; font-size: 12px; color: #000000; text-align: left !important;
      padding-left: 10px; border-top: 2px solid #000000; border-bottom: 1px solid #000000;
    }
    .excel-subtotal td {
      background: #f8fafc; font-weight: bold; color: #000000; border-top: 1px dashed #000000; border-bottom: 1px solid #000000;
    }
    .excel-grandtotal td {
      background: #dbeafe; font-weight: bold; font-size: 13px; color: #000000; border-top: 2px solid #000000; border-bottom: 3px double #000000;
    }

    .book-changed-badge {
      background-color: #666666 !important; color: #ffffff !important;
      font-weight: bold; padding: 2px 6px; border-radius: 4px; display: inline-block;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }

    /* 🖨️ LANDSCAPE 1-PAGE ULTRA INK-SAVER PRINT RULES */
    @page { size: landscape; margin: 0.35in; }
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; padding: 0; background: #ffffff !important; color: #000000 !important; }
      .no-print { display: none !important; }
      
      table.excel-full-sheet { border: 2px solid #000000 !important; font-size: 9.5px !important; }
      table.excel-full-sheet th, table.excel-full-sheet td { border: 1px solid #000000 !important; padding: 2px 4px !important; background: #ffffff !important; color: #000000 !important; }
      .excel-section-hdr td { font-weight: bold !important; border-top: 2px solid #000000 !important; border-bottom: 1px solid #000000 !important; }
      .excel-subtotal td { font-weight: bold !important; border-top: 1px dashed #000000 !important; }
      .excel-grandtotal td { font-weight: bold !important; border-top: 2px solid #000000 !important; border-bottom: 3px double #000000 !important; }
      .book-changed-badge { background-color: #666666 !important; color: #ffffff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }

    #configBox {
      width: 100%; max-width: 480px; margin-bottom: 16px; padding: 16px;
      background: #ffffff; border-radius: 18px; border: 1px solid #e2e8f0; font-size: 13px;
    }
    #configBox input { width: 100%; padding: 10px; margin-top: 8px; border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; box-sizing: border-box; }
  </style>
</head>
<body>

  <div id="configBox">
    <div><b>Apps Script URL:</b></div>
    <input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
    <button onclick="saveApiUrl()" style="margin-top:10px; background:#2563eb; color:#fff; border:none; padding:10px; width:100%; border-radius:8px; font-weight:bold;">Save URL</button>
  </div>

  <div id="status">
    <div class="circle-container">
      <svg viewBox="0 0 230 230">
        <circle class="bg-ring" cx="115" cy="115" r="105"></circle>
        <circle class="progress-ring" id="ringFill" cx="115" cy="115" r="105"></circle>
      </svg>
      <div class="ring-text">
        <div id="countDisplay">0 / 42</div>
      </div>
    </div>
    <div id="syncIndicator"><span class="dot idle" id="syncDot"></span> <span id="syncText">Live Sync Active</span></div>
  </div>

  <div class="actionRow">
    <button id="previewBtn" onclick="openPreview()">Preview & Print</button>
    <div class="btnGroup">
      <button id="endDayBtn" onclick="handleEndDay(event)">End of Day</button>
      <button id="resetBtn" onclick="handleReset(event)">Reset Day</button>
    </div>
  </div>

  <!-- PREVIEW & PRINT MODAL -->
  <div id="previewModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 style="margin:0; font-size:16px;">Daily Ticket Sales Report</h3>
        <button onclick="closePreview()" style="background:transparent; border:none; color:white; font-size:20px; cursor:pointer; padding:0;">✕</button>
      </div>
      <div class="modal-body" id="printArea">
        <div id="modalReportContent">
          <div style="text-align:center; padding:30px; color:#64748b;">Fetching live report data...</div>
        </div>
      </div>
      <div class="modal-footer no-print">
        <button onclick="window.print()" style="background:#16a34a; color:white; font-weight:bold;">🖨️ Print Report</button>
        <button onclick="closePreview()" style="background:#64748b; color:white;">Close</button>
      </div>
    </div>
  </div>

  <script>
    var API_URL = localStorage.getItem('appsScriptUrl') || '';
    document.getElementById('apiUrlInput').value = API_URL;
    if (API_URL) document.getElementById('configBox').style.display = 'none';

    function saveApiUrl() {
      var url = document.getElementById('apiUrlInput').value.trim();
      if (!url) return;
      localStorage.setItem('appsScriptUrl', url);
      API_URL = url;
      document.getElementById('configBox').style.display = 'none';
      refreshProgress();
    }

    var ringFill = document.getElementById('ringFill');
    var countDisplay = document.getElementById('countDisplay');
    var syncText = document.getElementById('syncText');
    var syncDot = document.getElementById('syncDot');

    var cachedTotal = parseInt(localStorage.getItem('cachedTotal'), 10) || 42;
    var cachedScanned = parseInt(localStorage.getItem('cachedScanned'), 10) || 0;
    const CIRCUMFERENCE = 660;

    var scanQueue = [];
    var isProcessingQueue = false;

    function setCircleProgress(fraction) {
      var f = Math.max(0, Math.min(1, fraction));
      var offset = CIRCUMFERENCE - (f * CIRCUMFERENCE);
      ringFill.style.strokeDashoffset = offset;
      ringFill.style.opacity = f <= 0 ? '0' : '1';
      ringFill.style.stroke = f >= 1 ? '#2563eb' : '#00F0FF';
    }

    function applyLiquidLevel() {
      countDisplay.textContent = cachedScanned + ' / ' + cachedTotal;
      setCircleProgress(cachedTotal > 0 ? cachedScanned / cachedTotal : 0);
      localStorage.setItem('cachedTotal', cachedScanned > 0 ? cachedTotal : 42);
      localStorage.setItem('cachedScanned', cachedScanned);
    }

    applyLiquidLevel();

    function updateSyncStatus(isSyncing, customMessage) {
      if (isSyncing) {
        syncDot.className = "dot syncing";
        syncText.textContent = customMessage || ("Syncing (" + scanQueue.length + " remaining)...");
      } else {
        syncDot.className = "dot idle";
        syncText.textContent = "Live Sync Active";
      }
    }

    function refreshProgress() {
      if (!API_URL || isProcessingQueue || scanQueue.length > 0) return;
      callApi({ action: 'progress' }).then(function(result) {
        if (result && result.totalGames > 0 && scanQueue.length === 0) {
          cachedTotal = result.totalGames;
          cachedScanned = result.scannedToday;
          applyLiquidLevel();
          updateSyncStatus(false);
        }
      }).catch(function(err) {});
    }

    setInterval(refreshProgress, 2500);

    var scanBuffer = '';
    var scanTimeout;

    document.addEventListener('keydown', function(e) {
      clearTimeout(scanTimeout);

      if (e.key === 'Enter') {
        e.preventDefault();
        var codeToSubmit = scanBuffer.trim();
        scanBuffer = '';
        if (codeToSubmit) enqueueScan(codeToSubmit);
        return;
      }

      if (e.key === 'Backspace') {
        scanBuffer = scanBuffer.slice(0, -1);
      } else if (e.key.length === 1) {
        scanBuffer += e.key;
      }

      scanTimeout = setTimeout(function() { scanBuffer = ''; }, 80);
    });

    function enqueueScan(code) {
      if (navigator.vibrate) navigator.vibrate(30);

      cachedScanned = Math.min(cachedTotal, cachedScanned + 1);
      applyLiquidLevel();

      scanQueue.push(code);
      updateSyncStatus(true);
      processNextQueueItem();
    }

    function processNextQueueItem() {
      if (isProcessingQueue || scanQueue.length === 0) {
        if (scanQueue.length === 0) updateSyncStatus(false);
        return;
      }

      isProcessingQueue = true;
      var currentCode = scanQueue[0];
      updateSyncStatus(true, "Syncing scan (" + scanQueue.length + " left)...");

      callApi({ action: 'scan', code: currentCode })
        .then(function(result) {
          scanQueue.shift();
          isProcessingQueue = false;

          if (!result || !result.success) {
            cachedScanned = Math.max(0, cachedScanned - 1);
            applyLiquidLevel();
          }

          if (scanQueue.length > 0) {
            processNextQueueItem();
          } else {
            updateSyncStatus(false);
            setTimeout(refreshProgress, 200);
          }
        })
        .catch(function(err) {
          isProcessingQueue = false;
          setTimeout(processNextQueueItem, 500);
        });
    }

    function openPreview() {
      document.getElementById('previewModal').style.display = 'flex';
      document.getElementById('modalReportContent').innerHTML = '<div style="text-align:center; padding:30px; color:#64748b;">Fetching live report data...</div>';

      callApi({ action: 'preview' }).then(function(res) {
        if (res && res.success && res.report) {
          renderExcelStyleReportHTML(res.report);
        } else {
          document.getElementById('modalReportContent').innerHTML = '<div style="color:#ef4444; text-align:center;">Failed to load preview data.</div>';
        }
      }).catch(function(err) {
        document.getElementById('modalReportContent').innerHTML = '<div style="color:#ef4444; text-align:center;">Error connecting to server.</div>';
      });
    }

    function closePreview() {
      document.getElementById('previewModal').style.display = 'none';
    }

    function renderExcelStyleReportHTML(rpt) {
      var html = '<div style="text-align:center; font-weight:bold; font-size:14px; margin-bottom:10px; font-family:Calibri, sans-serif;">DAILY ENTRY REPORT — ' + rpt.date + '</div>';

      html += '<table class="excel-full-sheet"><thead><tr>' +
        '<th>Game #</th><th>Book #</th><th>Start Ticket</th><th>End Ticket</th><th>Tickets Sold</th><th>Total Value ($)</th>' +
      '</tr></thead><tbody>';

      rpt.sections.forEach(function(sec) {
        html += '<tr class="excel-section-hdr"><td colspan="6">$' + sec.price + ' GAMES</td></tr>';

        sec.rows.forEach(function(r) {
          var bookDisplay = r.bookChanged
            ? '<span class="book-changed-badge">' + r.book + '</span>'
            : r.book;

          html += '<tr>' +
            '<td><b>' + r.game + '</b></td>' +
            '<td>' + bookDisplay + '</td>' +
            '<td>' + r.start + '</td>' +
            '<td>' + r.end + '</td>' +
            '<td>' + r.sold + '</td>' +
            '<td>$' + Math.round(r.value) + '</td>' +
          '</tr>';
        });

        html += '<tr class="excel-subtotal">' +
          '<td colspan="4" style="text-align:right;"><b>SUBTOTAL ($' + sec.price + ')</b></td>' +
          '<td><b>' + sec.subtotalTickets + '</b></td>' +
          '<td><b>$' + Math.round(sec.subtotalValue) + '</b></td>' +
        '</tr>';
      });

      html += '<tr class="excel-grandtotal">' +
        '<td colspan="4" style="text-align:right;"><b>GRAND TOTAL</b></td>' +
        '<td><b>' + rpt.grandTotalTickets + '</b></td>' +
        '<td><b>$' + Math.round(rpt.grandTotalValue) + '</b></td>' +
      '</tr>';

      html += '</tbody></table>';
      document.getElementById('modalReportContent').innerHTML = html;
    }

    var jsonpCounter = 0;
    function callApi(params) {
      return new Promise(function(resolve, reject) {
        if (!API_URL) return reject('no url');
        var callbackName = 'jsonpCallback' + (jsonpCounter++);
        window[callbackName] = function(result) {
          delete window[callbackName];
          if (script.parentNode) document.body.removeChild(script);
          resolve(result);
        };
        params.callback = callbackName;
        var url = API_URL + '?' + new URLSearchParams(params).toString();
        var script = document.createElement('script');
        script.src = url;
        document.body.appendChild(script);
      });
    }

    function handleEndDay(event) {
      if (!confirm('Close out the day? This archives everything.')) return;
      callApi({ action: 'endday' }).then(function() { refreshProgress(); });
    }

    function handleReset(event) {
      if (!confirm('Reset back to last End of Day?')) return;
      callApi({ action: 'reset' }).then(function() { refreshProgress(); });
    }
  </script>
</body>
</html>

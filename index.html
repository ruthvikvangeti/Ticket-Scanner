<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scratch-Off Scanner</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      margin: 0;
      padding: 20px;
      background: #0d1117;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Outer Card Box */
    #status {
      width: 100%; max-width: 480px;
      height: 320px;
      margin-bottom: 24px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #161b22 0%, #0d1117 70%);
      border-radius: 24px;
      border: 1px solid #30363d;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    /* Circular SVG Ring Setup */
    .circle-container {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg); /* Start ring at top center */
    }

    circle {
      fill: none;
      stroke-width: 14;
      stroke-linecap: round;
    }

    /* Background Ring Track */
    .bg-ring {
      stroke: rgba(255, 255, 255, 0.08);
    }

    /* Glowing Progress Ring Fill */
    .progress-ring {
      stroke: #00ff88;
      stroke-dasharray: 565; /* Circumference of circle (2 * π * 90) */
      stroke-dashoffset: 565; /* 565 = 0% filled */
      transition: stroke-dashoffset 0.5s ease-in-out, stroke 0.3s ease;
      filter: drop-shadow(0 0 8px rgba(0, 255, 136, 0.6));
    }

    /* Ring Center Label */
    .ring-text {
      position: absolute;
      text-align: center;
      pointer-events: none;
    }

    #countDisplay {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    #pctDisplay {
      font-size: 16px;
      font-weight: 600;
      color: #00ff88;
      margin-top: 4px;
    }

    /* Action Buttons */
    .actionRow { display: flex; gap: 12px; width: 100%; max-width: 480px; flex-shrink: 0; }
    button {
      flex: 1; padding: 18px; font-size: 16px; font-weight: bold; color: white;
      border: none; border-radius: 16px; cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      transition: transform 0.1s active;
    }
    #endDayBtn { background: rgba(52, 168, 83, 0.92); }
    #resetBtn { background: rgba(234, 67, 53, 0.92); }

    button:active { transform: scale(0.97); }

    #configBox {
      width: 100%; max-width: 480px; margin-bottom: 16px; padding: 12px;
      flex-shrink: 0;
      background: #161b22;
      border-radius: 16px; border: 1px solid #30363d; font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    #configBox input { width: 100%; padding: 8px; margin-top: 6px; box-sizing: border-box; }
  </style>
</head>
<body>

  <div id="configBox">
    <div>Apps Script URL (one-time setup):</div>
    <input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
    <button onclick="saveApiUrl()" style="margin-top:8px; background:#4285F4; border:none; color:#fff; border-radius:8px; padding:10px; width:100%;">Save URL</button>
  </div>

  <div id="status">
    <div class="circle-container">
      <svg>
        <circle class="bg-ring" cx="110" cy="110" r="90"></circle>
        <circle class="progress-ring" id="ringFill" cx="110" cy="110" r="90"></circle>
      </svg>
      <div class="ring-text">
        <div id="countDisplay">0 / 38</div>
        <div id="pctDisplay">0% Scanned</div>
      </div>
    </div>
  </div>

  <div class="actionRow">
    <button id="endDayBtn" onclick="handleEndDay(event)">End of Day</button>
    <button id="resetBtn" onclick="handleReset(event)">Reset Day</button>
  </div>

  <script>
    var API_URL = localStorage.getItem('appsScriptUrl') || '';
    document.getElementById('apiUrlInput').value = API_URL;
    if (API_URL) document.getElementById('configBox').style.display = 'none';

    function saveApiUrl() {
      var url = document.getElementById('apiUrlInput').value.trim();
      if (!url) return;
      localStorage.setItem('appsScriptUrl', url);
      API_URL = url;
      document.getElementById('configBox').style.display = 'none';
      refreshProgress();
    }

    var ringFill = document.getElementById('ringFill');
    var countDisplay = document.getElementById('countDisplay');
    var pctDisplay = document.getElementById('pctDisplay');

    var cachedTotal = 38;
    var cachedScanned = 0;
    const CIRCUMFERENCE = 565; // 2 * π * 90

    function setCircleProgress(fraction) {
      var f = Math.max(0, Math.min(1, fraction));
      // Calculate offset (565 = empty, 0 = fully filled circle)
      var offset = CIRCUMFERENCE - (f * CIRCUMFERENCE);
      ringFill.style.strokeDashoffset = offset;

      // Color transition when complete
      if (f >= 1) {
        ringFill.style.stroke = '#3b82f6'; // Bright blue on 100% complete
      } else {
        ringFill.style.stroke = '#00ff88'; // Vibrant green while filling
      }
    }

    function applyLiquidLevel() {
      var pct = cachedTotal > 0 ? cachedScanned / cachedTotal : 0;
      var pctInt = Math.round(pct * 100);
      
      countDisplay.textContent = cachedScanned + ' / ' + cachedTotal;
      pctDisplay.textContent = pctInt + '% Scanned';
      
      setCircleProgress(pct);
    }

    function refreshProgress() {
      if (!API_URL) return;
      callApi({ action: 'progress' }).then(function(result) {
        cachedTotal = result.totalGames || 38;
        cachedScanned = result.scannedToday || 0;
        applyLiquidLevel();
      }).catch(function(err) { /* silent catch */ });
    }

    // Bluetooth Scanner Keyboard Buffer Listener
    var scanBuffer = '';
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitScan(scanBuffer.trim());
        scanBuffer = '';
        return;
      }
      if (e.key === 'Backspace') {
        scanBuffer = scanBuffer.slice(0, -1);
        return;
      }
      if (e.key.length === 1) {
        scanBuffer += e.key;
      }
    });

    var jsonpCounter = 0;

    function callApi(params) {
      return new Promise(function(resolve, reject) {
        if (!API_URL) {
          document.getElementById('configBox').style.display = 'block';
          reject('no url');
          return;
        }

        var callbackName = 'jsonpCallback' + (jsonpCounter++);
        var timeoutId;

        window[callbackName] = function(result) {
          clearTimeout(timeoutId);
          delete window[callbackName];
          document.body.removeChild(script);
          resolve(result);
        };

        params.callback = callbackName;
        var url = API_URL + '?' + new URLSearchParams(params).toString();

        var script = document.createElement('script');
        script.src = url;
        script.onerror = function() {
          clearTimeout(timeoutId);
          delete window[callbackName];
          if (script.parentNode) document.body.removeChild(script);
          reject('Server error');
        };
        document.body.appendChild(script);

        timeoutId = setTimeout(function() {
          delete window[callbackName];
          if (script.parentNode) document.body.removeChild(script);
          reject('Timeout');
        }, 15000);
      });
    }

    function submitScan(code) {
      if (!code) return;

      var hadTotal = cachedTotal > 0;
      if (hadTotal) {
        cachedScanned = Math.min(cachedTotal, cachedScanned + 1);
        applyLiquidLevel();
      }

      callApi({ action: 'scan', code: code })
        .then(function(result) {
          refreshProgress();
        })
        .catch(function(err) {
          if (hadTotal) {
            cachedScanned = Math.max(0, cachedScanned - 1);
            applyLiquidLevel();
          }
        });
    }

    function handleEndDay(event) {
      if (!confirm('Close out the day? This archives everything.')) return;
      pctDisplay.textContent = 'Ending Day...';
      callApi({ action: 'endday' })
        .then(function(result) {
          refreshProgress();
        })
        .catch(function(err) {
          pctDisplay.textContent = 'Error resetting';
        });
    }

    function handleReset(event) {
      if (!confirm('Reset back to last End of Day?')) return;
      pctDisplay.textContent = 'Resetting...';
      callApi({ action: 'reset' })
        .then(function(result) {
          refreshProgress();
        })
        .catch(function(err) {
          pctDisplay.textContent = 'Error resetting';
        });
    }

    setTimeout(refreshProgress, 500);
  </script>
</body>
</html>
